<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}">
<head>
    <title>Contact Us - Smart Contact Manager</title>
</head>
<body>
    <div id="content" class="container mx-auto p-6 flex justify-center items-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-md max-w-lg w-full">
            <h1 class="text-4xl font-bold text-blue-600 text-center">Get in Touch</h1>
            <p class="mt-4 text-lg text-gray-700 text-center">We'd love to hear from you! Reach out to us for any queries or support.</p>
            
            <form class="mt-6">
                <div class="mb-5">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Your Name</label>
                    <input type="text" class="w-full px-4 py-3 border rounded-lg" placeholder="Enter your name" required>
                </div>
                <div class="mb-5">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Email Address</label>
                    <input type="email" class="w-full px-4 py-3 border rounded-lg" placeholder="Enter your email" required>
                </div>
                <div class="mb-5">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Message</label>
                    <textarea class="w-full px-4 py-3 border rounded-lg" rows="4" placeholder="Your message" required></textarea>
                </div>
                <button class="bg-blue-500 text-white px-6 py-3 rounded-lg w-full hover:bg-blue-600">Send Message</button>
            </form>
        </div>
    </div>
    <script>
        console.log("Contact page loaded successfully");
    </script>
</body>
</html>
