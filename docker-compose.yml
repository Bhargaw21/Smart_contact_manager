version: "3.8"

networks:
  scm_network:

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: bhargaw123
      MYSQL_DATABASE: scm20
      MYSQL_USER: root
      MYSQL_PASSWORD: bhargaw123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - scm_network

  app:
    image: bhargaw21/scm-app:latest
    build: .
    container_name: scm-app
    restart: always
    depends_on:
      - mysql
    environment:
      SPRING_APPLICATION_NAME: scm2.0
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-container:3307/scm20?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: bhargaw123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8081:8081"
    networks:
      - scm_network

volumes:
  mysql_data:
